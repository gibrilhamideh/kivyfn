[project]
name = "kivyfn"
version = "0.0.1"
description = "Application runtime framework for structured Kivy apps"
requires-python = ">=3.10"
dependencies = [
    "kivy>=2.3.0",
    "coloraide>=8.0.2"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[dependency-groups]
dev = [
    "kivy-stubs"
]

[tool.uv.sources]
kivy-stubs = { path = "../kivy-stubs", editable = true }
