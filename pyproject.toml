[project]
name = "kivyfn"
version = "0.1.0"
description = "Application runtime framework for structured Kivy apps"
requires-python = ">=3.10"
dependencies = [
    "kivy>=2.3.0",
    "coloraide>=8.0.2"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
kivyfn = ["kivy-lsp.toml"]

[dependency-groups]
dev = [
    "kivy-stubs"
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "E501"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.uv.sources]
kivy-stubs = { path = "../kivy-stubs", editable = true }
